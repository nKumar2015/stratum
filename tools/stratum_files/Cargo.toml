[package]
name = "stratum-files"
version.workspace = true
edition.workspace = true
description = "Stratum's file manager, and the desktop portal's file chooser"

[[bin]]
name = "stratum-files"
path = "src/main.rs"

[dependencies]
# The renderer, theme, widgets and window runner the shell uses.
stratum_ui = { path = "../stratum_ui" }
# Thumbnails decoded here; anything else goes to the thumbnailers installed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# The thumbnail cache's Thumb::URI and Thumb::MTime text chunks; image
# already builds it.
png = "0.18"
# SVG thumbnails; stratum_ui already links it for icons.
resvg = { version = "0.48", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# The FileChooser portal's D-Bus service.
zbus = { workspace = true }
# Waiting for each chooser without blocking the bus; zbus already builds it.
async-process = "2"
futures-lite = { version = "2", default-features = false }
chrono = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
