# Stratum shell defaults
#
# This file is every default the shell has: the binary contains none of its
# own and refuses a configuration that lacks a key. It is installed as
# share/stratum/config.default.toml beside the binary.
#
# Your own file, $XDG_CONFIG_HOME/stratum/config.toml (usually
# ~/.config/stratum/config.toml) or $STRATUM_CONFIG, is merged over this one:
# tables merge key by key, anything else (a value, a list) replaces the
# default. So it only needs the keys you change. The Home Manager module
# writes this whole file with your `settings` merged in.
#
# Unknown keys are a hard error, so typos surface instead of being ignored.

# Active theme, by key from the [themes.*] tables below.
theme = "carbon"

[appearance]
font_size = 13.0        # logical px
corner_radius = 15.0    # framed widgets and menus
animation_ms = 180      # 0 disables animation
framed_border = true
# Sidebar logo and status glyphs. A proportional Nerd Font ("… Nerd Font",
# not "… Nerd Font Mono") draws icons at their full size, as Quickshell did.
icon_font = "JetBrainsMonoNL Nerd Font"

[behavior]
poll_ms = 3000          # widgets without push updates
reload_on_change = true # watch this file and redraw when it changes
# Own org.freedesktop.Notifications. Set false to run beside another
# notification daemon, or the shell will log that the name is taken.
notifications = true
# Own org.kde.StatusNotifierWatcher and show tray icons. Same caveat as
# notifications: only one host can own it.
tray = true
# Be the session's polkit authentication agent and show the password dialog.
# polkit allows one agent per session; set false while another agent runs.
polkit = true

# The lock screen (`stratum-cli lockscreen lock`).
[lock]
wallpaper = "~/Pictures/Wallpapers/current_wp.png" # PNG, blurred; missing = plain
avatar = "~/Pictures/pfp.png"                      # PNG; missing = a user glyph
# PAM service for the password check. If /etc/pam.d has no such file, the
# shell tries stratum-shell, quickshell, then login. It refuses to lock when
# none exists, or when the service's modules cannot load in this binary (a
# build linked against an older glibc than the system's), because such a lock
# could never be undone; `stratum-cli lockscreen lock` then reports why.
pam_service = "stratum-shell"

[render]
# GPU to draw on: "auto", "nvidia", "radeon" or "intel". Only that vendor's
# Vulkan driver is loaded, which saves memory (the NVIDIA driver alone costs
# about 40 MiB). "auto" tries an integrated GPU first, then any other; a
# vendor with no GPU present falls back to "auto". Read at start only.
# VK_LOADER_DRIVERS_SELECT in the environment overrides this.
gpu = "auto"

[control_center]        # the settings window
width = 520             # logical px
animation_ms = 160      # 0 opens instantly
default_page = "overview"  # when opened without a page
invert_scroll = false   # true: turning the wheel down scrolls the page up

[screenshot]            # the viewer's annotation pen
# Drawn into the image, so they are fixed colours, not theme colours. The
# first is selected when the viewer opens.
pen_colors = ["#ff3b30", "#34c759", "#0a84ff", "#ffd60a", "#ffffff", "#000000"]
pen_size = 3            # on-screen px at 100 % zoom
pen_size_max = 16

[dashboard]             # `stratum-cli dashboard open [tab]`
sample_ms = 2000        # between CPU, memory, disk and GPU samples
history = 90            # samples the graphs keep (90 x 2 s = 3 minutes)
# Keep sampling while closed, so the graphs are full on open. A closed
# dashboard only records; nothing repaints.
background_history = true
processes = 12          # listed by the processes panel, busiest first
# Run when the processes panel's title is clicked; [] runs nothing.
process_monitor = ["kitty", "btop"]

# Weather from Open-Meteo, fetched only while the dashboard is open. The
# postal code is looked up once; the zip and coordinates go to Open-Meteo.
[dashboard.weather]
zip = "20001"           # Washington, DC
country = "US"          # ISO code: postal codes repeat across countries
# latitude = 38.8951    # set both to skip the postal code lookup
# longitude = -77.0364
units = "imperial"      # °F and mph; "metric" for °C and km/h
refresh_min = 30
hours = 6               # hourly forecast shown
days = 5                # daily forecast shown, today first

# Tabs, in order; it always opens on the first. A tab is rows of panels:
# rows share its height by weight, a row's panels its width. Panel kinds:
# glance (time, date, batteries, do-not-disturb), weather, performance (load
# bars), graphs (history, temperatures, network), processes, calendar, music.
[[dashboard.tabs]]
name = "Today"
icon = "\U000F056E"
rows = [
    { weight = 1.0, panels = [{ kind = "glance", weight = 1.0 }] },
    { weight = 5.5, panels = [
        { kind = "weather", weight = 1.0 },
        { kind = "calendar", weight = 1.15 },
        { kind = "music", weight = 1.0 },
    ] },
]

[[dashboard.tabs]]
name = "Calendar"
icon = "\U000F00ED"
rows = [{ weight = 1.0, panels = [{ kind = "calendar", weight = 1.0 }] }]

[[dashboard.tabs]]
name = "System"
icon = "\U000F04C5"
rows = [{ weight = 1.0, panels = [
    { kind = "graphs", weight = 3.0 },
    { kind = "processes", weight = 2.0 },
] }]

[sidebar]
position = "left"       # "left" or "right"
width = 40              # logical px, vertical rail
height = 32             # logical px, horizontal bar
padding = 12            # space above and below the widget column
spacing = 16            # gap between widgets
inverted_corners = true # scooped corners where the rail meets the screen edge
# axis = "vertical"     # or "horizontal"; omitted, it follows `position`

# Widgets are rendered in this order, top to bottom. Delete an entry to hide
# that widget. Each one says whether it is `framed` (a rounded box behind
# it). A widget with `height` omitted uses its intrinsic size; the app_title
# widget is flexible and absorbs the leftover space, which pushes everything
# after it to the bottom of the rail. Setting `sidebar.widgets` in your own
# file replaces this whole list.

[[sidebar.widgets]]
kind = "launcher"
framed = false

[[sidebar.widgets]]
kind = "workspaces"
framed = false

[[sidebar.widgets]]
kind = "app_title"
framed = false

[[sidebar.widgets]]
kind = "tray"
framed = false

# Container: draws a rounded frame and stacks its children.
[[sidebar.widgets]]
kind = "quick_panel"
framed = true
height = 86
children = [
  { kind = "audio", framed = false },
  { kind = "bluetooth", framed = false },
  { kind = "wifi", framed = false },
]

[[sidebar.widgets]]
kind = "battery"
framed = false

[[sidebar.widgets]]
kind = "clock"
framed = false

# Add a fixed gap anywhere:
# [[sidebar.widgets]]
# kind = "spacer"
# framed = false
# height = 12


