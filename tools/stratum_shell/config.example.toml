# Stratum shell configuration
#
# Copy to one of:
#   $XDG_CONFIG_HOME/stratum/config.toml   (usually ~/.config/stratum/config.toml)
# or point STRATUM_CONFIG at this file.
#
# Every field below is optional; the built-in defaults match the old QML shell.
# Unknown keys are a hard error, so typos surface instead of being ignored.

# Active theme, by key from the [themes.*] tables below.
theme = "carbon"

[appearance]
font_size = 13.0        # logical px
corner_radius = 15.0    # framed widgets and menus
animation_ms = 180      # 0 disables animation
framed_border = true

[behavior]
poll_ms = 3000          # widgets without push updates
reload_on_change = true # watch this file and redraw when it changes
# Own org.freedesktop.Notifications. Leave false while another notification
# daemon (for example Quickshell) is running, or the shell will log that the
# name is taken. Enable it once this shell is the only one.
notifications = false
# Own org.kde.StatusNotifierWatcher and show tray icons. Same caveat as
# notifications: only one host can own it.
tray = false
# Be the session's polkit authentication agent and show the password dialog.
# polkit allows one agent per session; leave false while stratumd runs.
polkit = false

# The lock screen (`stratum-cli lockscreen lock`).
[lock]
wallpaper = "~/Pictures/Wallpapers/current_wp.png" # PNG, blurred; missing = plain
avatar = "~/Pictures/pfp.png"                      # PNG; missing = a user glyph
# PAM service for the password check. If /etc/pam.d has no such file, the
# shell tries stratum-shell, quickshell, then login. It refuses to lock when
# none exists, or when the service's modules cannot load in this binary (a
# build linked against an older glibc than the system's), because such a lock
# could never be undone. Refusals fall back to Quickshell while both run.
pam_service = "stratum-shell"

[screenshot]            # the viewer's annotation pen
# Drawn into the image, so they are fixed colours, not theme colours. The
# first is selected when the viewer opens.
pen_colors = ["#ff3b30", "#34c759", "#0a84ff", "#ffd60a", "#ffffff", "#000000"]
pen_size = 3            # on-screen px at 100 % zoom
pen_size_max = 16

[sidebar]
position = "left"       # "left" or "right"
width = 40              # logical px
padding = 12            # space above and below the widget column
spacing = 16            # gap between widgets
inverted_corners = true # scooped corners where the rail meets the screen edge

# Widgets are rendered in this order, top to bottom. Delete an entry to hide
# that widget. A widget with `height` omitted uses its intrinsic size; the
# app_title widget is flexible and absorbs the leftover space, which pushes
# everything after it to the bottom of the rail.

[[sidebar.widgets]]
kind = "launcher"

[[sidebar.widgets]]
kind = "workspaces"

[[sidebar.widgets]]
kind = "app_title"

[[sidebar.widgets]]
kind = "tray"

# Container: draws a rounded frame and stacks its children.
[[sidebar.widgets]]
kind = "quick_panel"
framed = true
height = 86
children = [
  { kind = "audio" },
  { kind = "bluetooth" },
  { kind = "wifi" },
]

[[sidebar.widgets]]
kind = "battery"

[[sidebar.widgets]]
kind = "clock"

# Add a fixed gap anywhere:
# [[sidebar.widgets]]
# kind = "spacer"
# height = 12


