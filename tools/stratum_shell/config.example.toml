# Colours live in [themes]. This table is everything else: font sizes, widget
# sizes, paddings, gaps, radii, and animation timings. Every value here is what
# the widgets draw with, so a layout tweak is a number change, not a code change.
#
# Any section may be omitted; omitted values keep their defaults. Unknown keys
# are an error, so a typo tells you instead of silently doing nothing.
# ---------------------------------------------------------------------------

