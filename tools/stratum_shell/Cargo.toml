[package]
name = "stratum-shell"
version.workspace = true
edition.workspace = true
description = "Native Stratum desktop shell"

[[bin]]
name = "stratum-shell"
path = "src/main.rs"

[dependencies]
# Wayland protocol plumbing only — no UI toolkit.
# `system` enables libwayland-backed pointer access, which wgpu needs to build
# a VK_KHR_wayland_surface from a raw wl_surface.
# `xkbcommon` adds keyboard handling (keymap translation and keysyms); typing
# surfaces (power menu, lock screen, polkit, inline reply) all depend on it.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31", features = ["system"] }
calloop = "0.14"

# Rendering: Vulkan through wgpu, behind our own Renderer trait.
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl"] }
raw-window-handle = "0.6.2"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Vector geometry, text shaping, and icon rasterization.
lyon = "1.0"
cosmic-text = "0.19"
# Must match cosmic-text's fontdb version so glyph font IDs are the same type.
fontdb = "0.23"
swash = "0.2"
# No default features: they add SVG <text> layout with its own font stack,
# and GIF, WebP and JPEG decoders for embedded rasters. Icons need none of it.
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

serde = { workspace = true }
chrono = { workspace = true }

# System managers, shared with stratumd. The shell embeds them directly.
stratum_sys = { path = "../stratum_sys" }
# The managers use tokio internally; the shell gives them a small runtime on a
# worker thread instead of blocking the Wayland loop.
tokio = { workspace = true }
zbus = { workspace = true }
# `StreamExt` for zbus signal streams; already built for zbus.
futures-lite = { version = "2", default-features = false }
serde_json = { workspace = true }
toml = "1.1"
# FFI types for the PAM binding (malloc'd conversation replies, getpwuid_r).
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
