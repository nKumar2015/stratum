[package]
name = "stratum-shell"
version.workspace = true
edition.workspace = true
description = "Native Stratum desktop shell"

[[bin]]
name = "stratum-shell"
path = "src/main.rs"

[dependencies]
# Wayland protocol plumbing only — no UI toolkit.
# `system` enables libwayland-backed pointer access, which wgpu needs to build
# a VK_KHR_wayland_surface from a raw wl_surface.
# `xkbcommon` adds keyboard handling (keymap translation and keysyms); typing
# surfaces (power menu, lock screen, polkit, inline reply) all depend on it.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31", features = ["system"] }
calloop = "0.14"
# Protocols SCTK does not wrap: idle notification, single-pixel buffers and
# viewports (the idle dim), and wlr output power (screens off when idle).
# SCTK already builds both crates with these features, so they add only the
# protocol code the shell uses.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Blocking on zbus futures, and the gamma ramps' bytes. The renderer, text
# and icons are in stratum_ui.
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Screenshots, album art, clipboard images and wallpapers. Only PNG and JPEG:
# the other decoders are not needed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

serde = { workspace = true }
chrono = { workspace = true }

# The renderer, text, icons, configuration and widgets, shared with the apps.
stratum_ui = { path = "../stratum_ui" }

# System managers. The shell embeds them directly.
stratum_sys = { path = "../stratum_sys" }
# The managers use tokio internally; the shell gives them a small runtime on a
# worker thread instead of blocking the Wayland loop.
tokio = { workspace = true }
zbus = { workspace = true }
# `StreamExt` for zbus signal streams; already built for zbus.
futures-lite = { version = "2", default-features = false }
serde_json = { workspace = true }
toml = "1.1"
# FFI types for the PAM binding (malloc'd conversation replies, getpwuid_r).
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
