[package]
name = "stratum_sys"
version.workspace = true
edition.workspace = true

[lib]
name = "stratum_sys"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# System integration backends
pipewire = { workspace = true }
pulsectl-rs = { workspace = true }
libc = { workspace = true }
# Calendar events carry IANA zone names (TZID). Only the system's zoneinfo
# is read: no bundled database, no serde.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
