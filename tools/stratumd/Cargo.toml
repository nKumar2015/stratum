[package]
name = "stratumd"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.4"
zbus = "3.14"
zvariant = "3.12"
pam = "0.7"
tokio = { version = "1.0", features = ["full"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
