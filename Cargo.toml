[workspace]
members = [
    "tools/stratum_sys",
    "tools/stratum_shell",
    "tools/stratum_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime: a current-thread runtime per worker, timers, child processes.
tokio = { version = "1.0", features = ["rt", "time", "sync", "process", "io-util"] }

# D-Bus
zbus = "5.15"

# System integration
pipewire = "0.9.2"
pulsectl-rs = "0.3.2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Logging
tracing = "0.1"
# Filtered with `Targets`; `env-filter` would add regex matching. The default
# `tracing-log` forwards wgpu's `log` records.
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
