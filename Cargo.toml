[workspace]
members = ["tools/stratum_sys", "tools/stratumd", "tools/stratum_cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# D-Bus
zbus = "5.15"
zvariant = "5.10"

# System integration
pipewire = "0.9.2"
pulsectl-rs = "0.3.2"
bluer = { version = "0.17", features = ["bluetoothd"] }
libc = "0.2"
chrono = { version = "0.4", default-features = true }
lazy_static = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# CLI
dbus = "0.9"
urlencoding = "2.1"

# The shell (M1+) uses these; declared here so the workspace resolves one
# version set once the crate lands.
# wgpu, smithay-client-toolkit, calloop, cosmic-text, lyon, resvg …

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
